<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de socorrismo acuático · Comunitat Valenciana</title>
<meta name="description" content="Simulador de situaciones de primeros auxilios y salvamento acuático basado en el temario FSSCV/RFESS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6FAFB; --surface: #FFFFFF; --ink: #10232B; --muted: #4F6670; --line: #CFE0E6;
  --sea: #0B4F6C; --sea-ink: #0B4F6C; --sand: #F3E9D2; --sand-ink: #4A3A1A;
  --green: #1D8A4A; --yellow: #E9B51C; --red: #D7263D;
  --green-bg: #E6F4EB; --yellow-bg: #FBF3D6; --red-bg: #FBE3E6;
  --pole: #6B7C85; --focus: #0B4F6C; --on-sea: #FFFFFF;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1B21; --surface: #15262E; --ink: #E6EEF1; --muted: #A4B8C1; --line: #284049;
    --sea: #7FC3DC; --sea-ink: #9ED6EA; --sand: #2A2A22; --sand-ink: #EADFC2;
    --green: #3FBF72; --yellow: #F2C94C; --red: #F0566B;
    --green-bg: #15302A; --yellow-bg: #343019; --red-bg: #3A1C22;
    --pole: #93A6AF; --focus: #9ED6EA; --on-sea: #0E1B21;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1B21; --surface: #15262E; --ink: #E6EEF1; --muted: #A4B8C1; --line: #284049;
  --sea: #7FC3DC; --sea-ink: #9ED6EA; --sand: #2A2A22; --sand-ink: #EADFC2;
  --green: #3FBF72; --yellow: #F2C94C; --red: #F0566B;
  --green-bg: #15302A; --yellow-bg: #343019; --red-bg: #3A1C22;
  --pole: #93A6AF; --focus: #9ED6EA; --on-sea: #0E1B21;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
a { color: var(--sea-ink); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.01em; line-height: 1.05; margin: 0; }
h2 { font-size: 2rem; margin: 0.2rem 0 0.6rem; }
h3 { font-size: 1.35rem; font-weight: 700; margin: 1.4rem 0 0.5rem; }
p { margin: 0 0 0.75rem; }
button, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ---------- top ---------- */
#top { max-width: 900px; margin: 0 auto; padding: 1rem 1rem 0; display: grid; grid-template-columns: 1fr auto; gap: 0.5rem 1rem; align-items: start; }
.brand h1 { font-size: clamp(1.35rem, 5vw, 2.4rem); color: var(--sea-ink); text-transform: uppercase; }
.brand p { margin: 0.1rem 0 0; color: var(--muted); font-size: 0.9rem; }
.controls { display: flex; gap: 0.5rem; align-items: center; }
.lang { display: inline-flex; border: 2px solid var(--sea); border-radius: 999px; overflow: hidden; }
.lang button { border: 0; background: transparent; color: var(--sea-ink); padding: 0.35rem 0.75rem; font-weight: 700; cursor: pointer; }
.lang button.on { background: var(--sea); color: var(--on-sea); }
.theme { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; width: 2.4rem; height: 2.4rem; display: grid; place-items: center; cursor: pointer; color: var(--sea-ink); }
.tabs { grid-column: 1 / -1; display: flex; gap: 0.25rem; border-bottom: 2px solid var(--line); margin-top: 0.4rem; }
.tabs a { flex: 1; text-align: center; text-decoration: none; color: var(--muted); font-family: var(--font-display); font-weight: 700; font-size: clamp(0.8rem, 3.4vw, 1.3rem); text-transform: uppercase; padding: 0.5rem 0.15rem; border-bottom: 4px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tabs a.on { color: var(--sea-ink); border-bottom-color: var(--sea); }

/* ---------- layout ---------- */
#app { max-width: 900px; margin: 0 auto; padding: 1rem 1rem 3rem; }
.back { display: inline-block; margin-bottom: 0.75rem; text-decoration: none; font-weight: 700; }
.meta { display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; color: var(--muted); font-size: 0.9rem; margin-bottom: 0.4rem; }
.pill { border: 1.5px solid var(--line); border-radius: 999px; padding: 0 0.55rem; font-size: 0.8rem; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }
.hint { color: var(--muted); font-size: 0.95rem; }
.crit { color: var(--red); font-weight: 700; }
.warn { background: var(--yellow-bg); border-left: 4px solid var(--yellow); padding: 0.6rem 0.8rem; border-radius: 4px; }
.empty { background: var(--sand); color: var(--sand-ink); padding: 1rem; border-radius: 8px; }

/* buttons */
.btn { display: inline-block; border: 2px solid var(--sea); background: var(--sea); color: var(--on-sea); border-radius: 10px; padding: 0.7rem 1.1rem; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; }
.btn.ghost { background: transparent; color: var(--sea-ink); }
.btn.on { background: var(--sea); color: var(--on-sea); }
.btn.small { padding: 0.45rem 0.8rem; font-size: 0.95rem; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1rem 0; }
.toolbar { display: flex; justify-content: flex-end; margin: 0.5rem 0; }

/* chips */
.filters { display: grid; gap: 0.5rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0.3rem 0.8rem; cursor: pointer; font-size: 0.95rem; }
.chip.on { border-color: var(--sea); background: var(--sea); color: var(--on-sea); }

/* ---------- flags ---------- */
.flag { position: relative; display: inline-block; width: 22px; height: 28px; flex: none; }
.flag::before { content: ""; position: absolute; left: 3px; top: 0; width: 3px; height: 28px; background: var(--pole); border-radius: 2px; }
.flag::after { content: ""; position: absolute; left: 6px; top: 1px; width: 16px; height: 11px; background: var(--line); clip-path: polygon(0 0, 100% 0, 85% 50%, 100% 100%, 0 100%); }
.flag.green::after { background: var(--green); }
.flag.yellow::after { background: var(--yellow); }
.flag.red::after { background: var(--red); }
.flag.inline { vertical-align: middle; margin-right: 0.3rem; height: 22px; width: 18px; }
.flag.inline::before { height: 22px; }
.flag.inline::after { width: 12px; height: 8px; }
.flag.big { width: 44px; height: 56px; }
.flag.big::before { height: 56px; width: 5px; left: 5px; }
.flag.big::after { left: 10px; top: 2px; width: 34px; height: 22px; }

/* ---------- cases list ---------- */
.case-grid { display: grid; gap: 0.75rem; margin-top: 0.75rem; }
@media (min-width: 640px) { .case-grid { grid-template-columns: 1fr 1fr; } }
.case-card { display: block; background: var(--surface); border: 1.5px solid var(--line); border-left: 6px solid var(--sea); border-radius: 10px; padding: 0.9rem 1rem; text-decoration: none; color: inherit; }
.case-card h3 { margin: 0.2rem 0 0.3rem; font-size: 1.4rem; }
.case-card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
.case-card .status { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.6rem; font-size: 0.9rem; }

/* ---------- case ---------- */
.case-head, .play, .result, .intro, .exam, .chat, .progress { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 1.1rem 1.1rem 1.3rem; }
.victim { color: var(--muted); }
.scene { background: var(--sand); color: var(--sand-ink); border-radius: 8px; padding: 0.8rem 1rem; margin: 0.6rem 0 1rem; }
.scene h3, .scene summary { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; margin: 0 0 0.3rem; cursor: pointer; }
.scene p { margin: 0; }
details.scene p { margin-top: 0.4rem; }
.scope { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.5rem; }
.progressbar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 0.6rem 0 0.3rem; }
.progressbar span { display: block; height: 100%; background: var(--sea); transition: width 0.3s ease; }
.counter { color: var(--muted); font-size: 0.9rem; }

.timeline { list-style: none; margin: 0.5rem 0 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 13px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.timeline .phase { position: relative; margin: 1rem 0 0.5rem 2.6rem; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; color: var(--muted); font-size: 1.05rem; letter-spacing: 0.04em; }
.step { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 0.8rem; padding: 0.4rem 0 0.9rem; }
.step .marker { display: flex; flex-direction: column; align-items: center; gap: 0.1rem; background: var(--surface); position: relative; z-index: 1; }
.step .num { font-family: var(--font-display); font-weight: 800; font-size: 0.95rem; color: var(--muted); }
.step .body { min-width: 0; }
.step-text { font-weight: 700; margin-bottom: 0.3rem; }
.step .why { color: var(--muted); font-size: 0.93rem; margin: 0; }
.ref { display: inline-block; color: var(--muted); font-size: 0.8rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 0.3rem; margin-left: 0.2rem; }
.step.done.yellow .step-text { color: var(--ink); }
.picked { font-size: 0.93rem; margin: 0 0 0.3rem; }
.ask { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; margin-bottom: 0.5rem; }
.options { display: grid; gap: 0.5rem; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 0.7rem 0.9rem; cursor: pointer; line-height: 1.4; }
.opt:hover { border-color: var(--sea); }
.opt.on { border-color: var(--sea); background: var(--green-bg); }
.feedback { border-radius: 10px; padding: 0.8rem 0.9rem; margin-bottom: 0.7rem; border-left: 6px solid var(--line); }
.feedback.green { background: var(--green-bg); border-left-color: var(--green); }
.feedback.yellow { background: var(--yellow-bg); border-left-color: var(--yellow); }
.feedback.red { background: var(--red-bg); border-left-color: var(--red); }
.fb-head { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; margin-bottom: 0.4rem; }
.feedback.red .fb-head { color: var(--red); }
.feedback .why { color: var(--ink); opacity: 0.85; }
.right { margin: 0.4rem 0; }

/* result */
.result { border-left-width: 8px; }
.result.green { border-left-color: var(--green); }
.result.yellow { border-left-color: var(--yellow); }
.result.red { border-left-color: var(--red); }
.score-row { display: flex; align-items: center; gap: 1rem; margin: 0.5rem 0; }
.score { font-size: 1.2rem; margin: 0 0 0.2rem; }
.score strong { font-family: var(--font-display); font-size: 2.6rem; font-weight: 800; line-height: 1; vertical-align: -0.1em; }
.verdict { font-weight: 700; }
.note { background: var(--sand); color: var(--sand-ink); border-radius: 8px; padding: 0.7rem 0.9rem; margin: 0.6rem 0; font-size: 0.95rem; }
.timeline.review::before { display: none; }
.timeline.review .step { padding-bottom: 0.5rem; }

/* ---------- exam ---------- */
.q { border: 0; border-top: 2px solid var(--line); padding: 1rem 0 0.4rem; margin: 0.6rem 0 0; min-width: 0; }
.q legend { font-weight: 700; padding: 0; margin-bottom: 0.5rem; }
.qn { display: inline-grid; place-items: center; min-width: 1.7rem; height: 1.7rem; border-radius: 999px; background: var(--sea); color: var(--on-sea); font-family: var(--font-display); font-weight: 800; margin-right: 0.5rem; }
.q .opt { display: block; width: 100%; margin: 0.35rem 0; }
.q-res { border-top: 2px solid var(--line); padding: 0.8rem 0; border-left: 6px solid var(--line); padding-left: 0.8rem; margin-top: 0.6rem; border-radius: 4px; }
.q-res.green { border-left-color: var(--green); }
.q-res.yellow { border-left-color: var(--yellow); }
.q-res.red { border-left-color: var(--red); }
.q-text { font-weight: 700; }
.q-opt { margin: 0.15rem 0; color: var(--muted); font-size: 0.95rem; }
.q-opt.ok { color: var(--green); font-weight: 700; }
.q-opt.chosen:not(.ok) { color: var(--red); }
.q-res .why { color: var(--ink); opacity: 0.85; margin-top: 0.4rem; font-size: 0.93rem; }

/* ---------- dialog ---------- */
.field { display: grid; gap: 0.3rem; margin: 0.8rem 0; }
.field select { border: 2px solid var(--line); border-radius: 10px; padding: 0.6rem; background: var(--surface); max-width: 100%; }
.messages { display: grid; gap: 0.7rem; max-height: 60vh; overflow-y: auto; padding: 0.4rem 0.2rem; }
.msg { display: grid; gap: 0.15rem; }
.msg .who { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: 0.9rem; color: var(--muted); letter-spacing: 0.04em; }
.bubble { border-radius: 12px; padding: 0.7rem 0.9rem; background: var(--sand); color: var(--sand-ink); max-width: 95%; overflow-wrap: anywhere; }
.msg.user { justify-items: end; }
.msg.user .bubble { background: var(--sea); color: var(--on-sea); }
.msg.eval .bubble { background: var(--surface); border: 2px solid var(--sea); color: var(--ink); max-width: 100%; }
.bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 0.3rem 0 0.5rem 1.2rem; padding: 0; }
.bubble h4 { margin: 0.5rem 0 0.2rem; font-size: 1.15rem; }
.msg.streaming .bubble { opacity: 0.85; }
.composer { display: grid; gap: 0.5rem; margin-top: 0.8rem; }
.composer textarea { width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 0.7rem; background: var(--surface); resize: vertical; min-height: 3.2rem; }
.composer-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

/* ---------- progress ---------- */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; margin: 0.8rem 0; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stats div { background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 0.6rem 0.8rem; display: grid; }
.stats strong { font-family: var(--font-display); font-size: 2rem; font-weight: 800; line-height: 1.1; }
.stats span { color: var(--muted); font-size: 0.85rem; }
.env-row { margin-top: 0.8rem; }
.env-row h3 { margin: 0.4rem 0; }
.mini { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 0.6rem; padding: 0.45rem 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.mini strong { font-family: var(--font-display); font-size: 1.2rem; }
.exam-list, .weak { list-style: none; margin: 0; padding: 0; }
.exam-list li, .weak li { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 0.6rem; padding: 0.45rem 0; border-top: 1px solid var(--line); }
.weak li { grid-template-columns: 22px 1fr; }
.weak em { color: var(--muted); font-style: normal; font-size: 0.85rem; }

@media (max-width: 480px) {
  body { font-size: 16px; }
  #top { grid-template-columns: 1fr; }
  .controls { justify-content: flex-start; }
  .score-row { align-items: flex-start; }
}

/* ---------- name ---------- */
.who-row { display: flex; align-items: center; gap: 0.7rem; }
.avatar { width: 44px; height: 44px; border-radius: 999px; border: 2px solid var(--line); object-fit: cover; }
.name-form { display: flex; flex-wrap: wrap; align-items: end; gap: 0.5rem; margin: 0.6rem 0 0.4rem; }
.name-form label { display: grid; gap: 0.25rem; flex: 1 1 200px; }
.name-form span { font-size: 0.85rem; color: var(--muted); }
.name-form input { border: 2px solid var(--line); border-radius: 10px; padding: 0.55rem 0.7rem; background: var(--surface); width: 100%; }

/* ---------- voice ---------- */
.switch { display: inline-flex; align-items: center; gap: 0.5rem; margin: 0.2rem 0 0.6rem; font-size: 0.95rem; cursor: pointer; }
.switch input { width: 1.2rem; height: 1.2rem; accent-color: var(--sea); }
.speak { display: inline-block; margin-top: 0.5rem; border: 1.5px solid currentColor; background: transparent; border-radius: 999px; padding: 0.15rem 0.6rem; font-size: 0.85rem; cursor: pointer; opacity: 0.85; }
.speak.on { background: var(--sea); color: var(--on-sea); border-color: var(--sea); opacity: 1; }
.btn.mic { display: inline-flex; align-items: center; gap: 0.4rem; background: transparent; color: var(--sea-ink); }
.btn.mic.listening { background: var(--red); border-color: var(--red); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(215, 38, 61, 0.45); } 50% { box-shadow: 0 0 0 8px rgba(215, 38, 61, 0); } }

/* ---------- api panel / files ---------- */
.api-panel { background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 0.8rem 1rem; margin: 0.8rem 0; }
.api-panel h3 { margin: 0 0 0.3rem; }
.field input { border: 2px solid var(--line); border-radius: 10px; padding: 0.6rem; background: var(--surface); width: 100%; }
.file-btn { cursor: pointer; }

/* ---------- simulación ---------- */
.g-stage { position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.g-canvas { display: block; width: 100%; height: auto; }
.g-hud { position: absolute; left: 8px; top: 8px; display: grid; gap: 3px; background: rgba(16,35,43,0.78); color: #fff; padding: 6px 8px; border-radius: 8px; font-size: 0.8rem; min-width: 150px; }
.g-time { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1; }
.g-bar { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 6px; }
.g-bar i { display: block; height: 8px; background: rgba(255,255,255,0.25); border-radius: 999px; overflow: hidden; }
.g-bar b { display: block; height: 100%; background: #1D8A4A; transition: width 0.2s linear; }
.g-bar.yellow b { background: #E9B51C; } .g-bar.red b { background: #D7263D; }
.g-status { font-size: 0.75rem; opacity: 0.9; }
.g-signal { position: absolute; right: 8px; top: 8px; border: 2px solid #fff; background: #0B4F6C; color: #fff; border-radius: 999px; padding: 0.5rem 0.9rem; font-weight: 700; cursor: pointer; }
.g-signal[disabled] { opacity: 0.45; cursor: default; }
.g-joy { position: absolute; left: 14px; bottom: 14px; width: 110px; height: 110px; border-radius: 50%; background: rgba(16,35,43,0.35); border: 2px solid rgba(255,255,255,0.6); display: none; }
.g-knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,0.85); }
.g-action { position: absolute; right: 14px; bottom: 14px; width: 92px; height: 92px; border-radius: 50%; border: 3px solid #fff; background: #D7263D; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
@media (pointer: coarse) { .g-joy { display: block; } }
.g-stage.touch .g-joy { display: block; }
.g-overlay { position: absolute; inset: 0; background: rgba(16,35,43,0.55); display: grid; place-items: center; padding: 1rem; }
.g-card { background: var(--surface); color: var(--ink); border-radius: 12px; padding: 1rem; width: min(560px, 100%); max-height: 100%; overflow: auto; }
.g-card h3 { margin: 0 0 0.6rem; }
.g-card.wide { width: 100%; }
.g-log { margin-top: 0.5rem; font-size: 0.9rem; min-height: 1.5rem; }
.g-log p { margin: 0.15rem 0; color: var(--muted); }
.g-log p span { font-family: var(--font-display); font-weight: 700; color: var(--sea-ink); margin-right: 0.3rem; }
.g-log p.ok { color: var(--green); } .g-log p.bad { color: var(--red); font-weight: 700; } .g-log p.warn { color: #9A7612; }
.g-pa { padding: 0.8rem; display: grid; gap: 0.6rem; }
.g-pahud { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 0.5rem 0.8rem; }
.g-pahud .g-bar { min-width: 180px; } .g-pahud .g-bar i { background: var(--line); }
.g-fb { margin-top: 0.5rem; }
.g-flash { color: var(--red); font-weight: 700; margin: 0.4rem 0; }
.g-hold, .g-press { width: 100%; font-size: 1.2rem; padding: 1rem; margin: 0.5rem 0; touch-action: none; }
.g-press { background: var(--red); border-color: var(--red); color: #fff; font-family: var(--font-display); font-size: 1.6rem; text-transform: uppercase; }
.g-press.pressed { transform: scale(0.97); filter: brightness(0.9); }
.g-press small { font-family: var(--font-body); font-size: 0.9rem; text-transform: none; font-weight: 400; }
.g-chest { display: grid; gap: 0.3rem; max-width: 320px; margin: 0 auto; }
.g-gauge { position: relative; height: 16px; background: var(--line); border-radius: 999px; overflow: hidden; }
.g-gauge i { position: absolute; top: 0; height: 100%; background: rgba(29,138,74,0.45); }
.g-gauge b { position: absolute; left: 0; top: 0; height: 100%; background: var(--sea); border-radius: 999px; }
.g-metro { position: relative; height: 18px; background: var(--line); border-radius: 999px; margin: 0.4rem 0; overflow: hidden; }
.g-zone { position: absolute; left: 44%; width: 12%; top: 0; height: 100%; background: rgba(29,138,74,0.5); }
.g-needle { position: absolute; top: 0; width: 4px; height: 100%; background: var(--red); margin-left: -2px; }
.g-prep { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
.g-prep .btn.on { background: var(--green); border-color: var(--green); color: #fff; }
.g-torso { position: relative; max-width: 300px; margin: 0 auto; touch-action: none; }
.g-target { position: absolute; width: 14%; aspect-ratio: 1; border: 3px dashed var(--sea); border-radius: 50%; opacity: 0.8; }
.g-pad { position: absolute; width: 14%; aspect-ratio: 1; border-radius: 6px; background: #E9B51C; color: #10232B; display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); font-size: 1.1rem; cursor: grab; box-shadow: 0 2px 6px rgba(0,0,0,0.3); touch-action: none; }
.g-pad.ok { background: var(--green); color: #fff; cursor: default; }
.g-notes { margin: 0.5rem 0 0 1.1rem; padding: 0; font-size: 0.95rem; }

.g-stage.portrait .g-hud { font-size: 0.72rem; min-width: 128px; padding: 4px 6px; }
.g-stage.portrait .g-hud .g-bar { grid-template-columns: 62px 1fr; }
.g-stage.portrait .g-time { font-size: 1.1rem; }
.g-stage.portrait .g-signal { padding: 0.4rem 0.7rem; font-size: 0.9rem; }

  paPrefix: [

  pa: [

/* ===== Simulación tipo videojuego =====
   Rescate 2D desde arriba (canvas) + mini-juegos de técnica (DOM).
   createGame(api) → { render(root), stop() } */

function createGame(api) {
  'use strict';
  const { L, esc, UI, CASES, T, lang, flagHtml, record, progress, go } = api;
  const G = UI.game;

  /* ---------- escenarios ---------- */
  const SCEN = [
    { id: 'g-pis-ahog4', caseId: 'pis-ahog4', map: 'pool', victim: { conscious: false, breathing: false }, pa: 'pcr', drowning: true },
    { id: 'g-pla-lm', caseId: 'pla-lm-romp', map: 'beach', victim: { conscious: false, breathing: false, lm: true }, pa: 'pcr', drowning: true, cervical: true, sand: true, noDive: true },
    { id: 'g-pla-ahog2', caseId: 'pla-ahog2', map: 'beach', rip: true, victim: { conscious: true, panic: true, fatigue: 100 }, pa: 'decisions' },
    { id: 'g-pis-convuls', caseId: 'pis-convuls', map: 'pool', victim: { conscious: false, breathing: true, convulsing: 40 }, pa: 'decisions' },
    { id: 'g-agu-hipo', caseId: 'agu-hipotermia', map: 'lake', victim: { conscious: true, panic: false, fatigue: 100, cold: true }, pa: 'decisions', boya: true },
    { id: 'g-par-pcr', caseId: 'par-pcr', map: 'none', land: true, pa: 'pcr', drowning: false, wetFloor: true }
  ];
  const scenById = (id) => SCEN.find((s) => s.id === id);
  const caseOf = (sc) => CASES.find((c) => c.id === sc.caseId);

  /* ---------- estado ---------- */
  let root = null, canvas = null, ctx = null, raf = 0, last = 0, running = false;
  let W = 800, H = 500;
  let st = null;          // partida
  const keys = {};
  const joy = { active: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0 };
  let actionHeld = false;

  function newState(sc) {
    const map = sc.map; sc.victim = sc.victim || {};
    const s = {
      sc, phase: 'play', t: 0, msg: [], flags: [], wrong: 0, crit: [], paused: false,
      signalAt: null, partnerAt: null, desaAt: null, partnerHere: false, desaHere: false,
      hasTube: false, inWater: false, entered: false, contact: false, towing: false, extracted: false,
      grabbedUntil: 0, holdUntil: 0, firstVentAt: null, o2Zero: false,
      player: { x: 70, y: 260, r: 11, speed: 150 },
      victim: { x: 600, y: 250, r: 12, faceUp: false, o2: 72, fatigue: 100, temp: 100, conscious: !!sc.victim.conscious, breathing: !!sc.victim.breathing, convulsing: sc.victim.convulsing || 0, grabbed: false },
      tube: { x: 95, y: 300, taken: false },
      cpr: null, result: null
    };
    if (map === 'pool') { s.player = { x: P.playerPool.x, y: P.playerPool.y, r: 11, speed: 150 }; s.victim.x = P.victimPool.x; s.victim.y = P.victimPool.y; s.tube = { x: P.tubePool.x, y: P.tubePool.y, taken: false }; }
    if (map === 'beach') { const vv = sc.rip ? P.victimRip : P.victimShore; s.player = { x: P.playerShore.x, y: P.playerShore.y, r: 11, speed: 150 }; s.victim.x = vv.x; s.victim.y = vv.y; s.tube = { x: P.tubeShore.x, y: P.tubeShore.y, taken: false }; }
    if (map === 'lake') { s.player = { x: P.playerShore.x, y: P.playerShore.y, r: 11, speed: 150 }; s.victim.x = P.victimLake.x; s.victim.y = P.victimLake.y; s.tube = { x: P.tubeShore.x, y: P.tubeShore.y, taken: false }; s.victim.temp = 55; }
    if (sc.victim.cold) s.victim.o2 = 95;
    if (sc.victim.conscious) s.victim.o2 = 95;
    return s;
  }

  /* ---------- utilidades ---------- */
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const say = (txt, kind) => { st.msg.unshift({ t: st.t, txt, kind: kind || '' }); st.msg = st.msg.slice(0, 4); updateLog(); };
  const fmt = (sec) => { const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m + ':' + (s < 10 ? '0' : '') + s; };
  function markWrong() { st.wrong += 1; }
  function markCrit(text) { st.crit.push(text); }

  /* ---------- geometría de mapas (apaisado / vertical) ---------- */
  let POOL, SHORE_Y, DRY_Y, RIP, P;
  function setLayout(portrait) {
    if (portrait) {
      W = 500; H = 760;
      POOL = { x: 90, y: 110, w: 330, h: 520 }; SHORE_Y = 560; DRY_Y = 640; RIP = { x: 200, w: 100 };
      P = { chair: { x: 18, y: 360 }, nurse: { x: 14, y: 30, w: 62, h: 40 }, puesto: { x: 190, y: 660 }, flag: { x: 240, y: 648 },
            playerPool: { x: 45, y: 330 }, tubePool: { x: 55, y: 410 }, victimPool: { x: 375, y: 190 },
            playerShore: { x: 250, y: 700 }, tubeShore: { x: 290, y: 705 }, victimRip: { x: 250, y: 230 }, victimShore: { x: 240, y: 330 }, victimLake: { x: 330, y: 150 },
            desaPool: { x: 50, y: 160 }, desaShore: { x: 150, y: 668 } };
    } else {
      W = 800; H = 500;
      POOL = { x: 150, y: 70, w: 560, h: 360 }; SHORE_Y = 340; DRY_Y = 400; RIP = { x: 370, w: 100 };
      P = { chair: { x: 48, y: 232 }, nurse: { x: 30, y: 60, w: 70, h: 40 }, puesto: { x: 50, y: 430 }, flag: { x: 100, y: 418 },
            playerPool: { x: 70, y: 250 }, tubePool: { x: 92, y: 300 }, victimPool: { x: 610, y: 240 },
            playerShore: { x: 90, y: 450 }, tubeShore: { x: 120, y: 455 }, victimRip: { x: 420, y: 150 }, victimShore: { x: 300, y: 250 }, victimLake: { x: 560, y: 120 },
            desaPool: { x: 110, y: 110 }, desaShore: { x: 150, y: 420 } };
    }
  }
  setLayout(false);
  function isWater(p) {
    const m = st.sc.map;
    if (m === 'pool') return p.x > POOL.x && p.x < POOL.x + POOL.w && p.y > POOL.y && p.y < POOL.y + POOL.h;
    return p.y < SHORE_Y;
  }
  function nearPoolEdge(p) {
    const dx = Math.min(Math.abs(p.x - POOL.x), Math.abs(p.x - (POOL.x + POOL.w)));
    const dy = Math.min(Math.abs(p.y - POOL.y), Math.abs(p.y - (POOL.y + POOL.h)));
    return Math.min(dx, dy) < 22;
  }
  function inRip(p) { return st.sc.rip && p.y < SHORE_Y && p.x > RIP.x && p.x < RIP.x + RIP.w; }

  /* ---------- bucle ---------- */
  function loop(ts) {
    if (!running) return;
    const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    if (!st.paused && st.phase === 'play') { update(dt); draw(); updateHud(); }
    raf = requestAnimationFrame(loop);
  }

  function update(dt) {
    st.t += dt;
    const s = st, p = s.player, v = s.victim, sc = s.sc;
    // llegada de compañero y DESA
    if (s.signalAt !== null) {
      if (!s.partnerHere && s.t >= s.partnerAt) { s.partnerHere = true; say(L(G.partnerHere), 'ok'); }
      if (!s.desaHere && s.t >= s.desaAt) { s.desaHere = true; say(L(G.desaHere), 'ok'); }
    }
    // movimiento
    let mx = 0, my = 0;
    if (keys.ArrowLeft || keys.a || keys.A) mx -= 1; if (keys.ArrowRight || keys.d || keys.D) mx += 1;
    if (keys.ArrowUp || keys.w || keys.W) my -= 1; if (keys.ArrowDown || keys.s || keys.S) my += 1;
    if (joy.active) { mx += joy.dx; my += joy.dy; }
    const len = Math.hypot(mx, my); if (len > 1) { mx /= len; my /= len; }
    const frozen = s.t < s.grabbedUntil || s.t < s.holdUntil;
    if (!frozen && (mx || my)) {
      let spd = p.speed;
      if (s.inWater) spd = s.towing ? (s.hasTube ? 52 : 38) : (s.hasTube || sc.boya ? 78 : 70);
      let nx = p.x + mx * spd * dt, ny = p.y + my * spd * dt;
      if (inRip({ x: nx, y: ny })) ny -= 42 * dt;   // corriente de retorno empuja mar adentro
      nx = clamp(nx, 12, W - 12); ny = clamp(ny, 12, H - 12);
      // entrada al agua: en piscina pide elección al cruzar el bordillo
      const wasWater = isWater(p), willWater = isWater({ x: nx, y: ny });
      if (!wasWater && willWater && !s.entered) { askEntry(); return; }
      if (!wasWater && willWater && s.entered) { s.inWater = true; }
      if (wasWater && !willWater) {
        if (s.towing && !s.extracted) { askExtract(); return; }
        s.inWater = false;
      }
      p.x = nx; p.y = ny;
      if (s.towing) { v.x = p.x - mx * 16; v.y = p.y - my * 16; }
    }
    // coger el tubo
    if (!s.tube.taken && dist(p, s.tube) < 20) { s.tube.taken = true; s.hasTube = true; say(L(sc.boya ? G.tookBuoy : G.tookTube), 'ok'); }
    // víctima en el agua
    if (!s.contact) {
      if (v.conscious) {
        v.fatigue -= (sc.victim.cold ? 2.2 : 2.6) * dt;
        if (inRip(v)) v.y = Math.max(60, v.y - 6 * dt);
        if (v.fatigue <= 0) { v.conscious = false; v.breathing = false; v.faceUp = false; say(L(G.victimSank), 'bad'); }
      }
      if (!v.conscious) { if (v.convulsing > 0) { v.convulsing -= dt; v.o2 -= 0.5 * dt; } else if (!v.breathing) v.o2 -= 1.5 * dt; }
      v.temp -= (sc.victim.cold ? 1.4 : 0.35) * dt;
      // contacto
      if (dist(p, v) < p.r + v.r + 12) askContact();
    } else {
      if (!v.breathing && !v.faceUp) v.o2 -= 1.5 * dt;           // remolque boca abajo (error crítico)
      else if (!v.breathing) v.o2 -= 0.45 * dt;
      if (v.convulsing > 0) { v.convulsing -= dt; if (v.convulsing <= 0) { v.convulsing = 0; say(L(G.convulsionsStopped), 'ok'); } }
      v.temp -= (s.inWater ? (sc.victim.cold ? 1.4 : 0.35) : 0.25) * dt;
    }
    if (v.o2 <= 0 && !s.o2Zero) { s.o2Zero = true; v.o2 = 0; say(L(G.o2zero), 'bad'); }
    v.o2 = clamp(v.o2, 0, 100); v.temp = clamp(v.temp, 0, 100); v.fatigue = clamp(v.fatigue, 0, 100);
  }

  /* ---------- acciones ---------- */
  function signal() {
    const s = st; if (s.signalAt !== null) return;
    s.signalAt = s.t;
    const beach = s.sc.map !== 'pool';
    s.partnerAt = s.t + (beach ? 38 : 25); s.desaAt = s.t + (beach ? 70 : 50);
    say(L(G.signalDone), 'ok');
    updateHud();
  }

  function askEntry() {
    const s = st; const pool = s.sc.map === 'pool';
    const opts = pool
      ? [{ t: G.entryGiant, ok: true }, { t: G.entryDive, crit: G.critDivePool }, { t: G.entryHole, wrong: true }]
      : [{ t: G.entryRun, ok: true }, { t: G.entryDiveWave, crit: G.critDiveBeach }];
    if (!s.hasTube && !s.sc.boya) opts.push({ t: G.entryBack, back: true });
    choice(L(G.entryTitle), opts, (o) => {
      if (o.back) return;
      if (o.crit) { markCrit(L(o.crit)); s.injured = true; say(L(o.crit), 'bad'); finishGame(); return; }
      if (o.wrong) { markWrong(); say(L(G.entryHoleWhy), 'warn'); }
      s.entered = true; s.inWater = true;
      if (!s.hasTube) say(L(G.noTubeWarn), 'warn');
    });
  }

  function askContact() {
    const s = st, v = s.victim, sc = s.sc;
    s.contact = true;
    let opts;
    if (v.convulsing > 0) {
      opts = [{ t: G.cHoldConv, ok: true, hold: true }, { t: G.cExtractNow, wrong: G.cExtractNowWhy }, { t: G.cMouthObj, crit: G.critMouth }];
    } else if (v.conscious && sc.victim.panic) {
      opts = s.hasTube ? [{ t: G.cTubeFront, ok: true }, { t: G.cFrontal, crit: G.critGrab }]
                       : [{ t: G.cFrontalNoTube, crit: G.critGrab }, { t: G.cWaitTired, wrong: G.cWaitTiredWhy }];
    } else if (v.conscious) {
      opts = [{ t: G.cTubeFront, ok: true }, { t: G.cFrontal, wrong: G.critGrab }];
    } else if (sc.victim.lm) {
      opts = [{ t: G.cBicepsTriceps, ok: true }, { t: G.cHeadOneHand, crit: G.critHead }, { t: G.cTowFaceDown, crit: G.critFaceDown }];
    } else {
      opts = [{ t: G.cTurnAirway, ok: true }, { t: G.cTowFaceDown, crit: G.critFaceDown }, { t: G.cMouthHere, wrong: G.cMouthHereWhy }];
    }
    choice(L(G.contactTitle), opts, (o) => {
      if (o.crit) {
        markCrit(L(o.crit)); say(L(o.crit), 'bad');
        if (o.crit === G.critGrab) { s.grabbedUntil = s.t + 4; v.faceUp = true; s.towing = true; }
        else if (o.crit === G.critFaceDown) { v.faceUp = false; s.towing = true; }
        else if (o.crit === G.critMouth) { v.faceUp = true; s.towing = true; }
        else { v.faceUp = true; s.towing = true; }
        return;
      }
      if (o.wrong) { markWrong(); say(L(o.wrong), 'warn'); s.holdUntil = s.t + 6; v.faceUp = true; s.towing = true; return; }
      if (o.hold) { v.faceUp = true; s.holdUntil = s.t + Math.max(0, v.convulsing); s.towing = true; say(L(G.holdingConv), 'ok'); return; }
      v.faceUp = true; s.towing = true; say(L(G.controlOk), 'ok');
      if (sc.victim.lm) {
        setTimeout(() => choice(L(G.lmBreathTitle), [{ t: G.lmExtractNow, ok: true }, { t: G.lmWaitBoard, crit: G.critWaitBoard }], (o2) => {
          if (o2.crit) { markCrit(L(o2.crit)); say(L(o2.crit), 'bad'); s.holdUntil = s.t + 15; } else say(L(G.lmExtractWhy), 'ok');
        }), 50);
      }
    });
  }

  function askExtract() {
    const s = st;
    if (s.victim.convulsing > 0) { say(L(G.waitConv), 'warn'); s.player.y += 0; return; }
    const alone = !s.partnerHere;
    const opts = [{ t: alone ? G.extractAlone : G.extractWithPartner, ok: true, secs: alone ? 12 : 4 }];
    if (alone && s.signalAt !== null) opts.push({ t: G.extractWait, wait: true });
    if (!s.sc.victim.breathing && !s.victim.conscious) opts.push({ t: G.extractSit, crit: G.critSit });
    choice(L(G.extractTitle), opts, (o) => {
      if (o.wait) return;
      if (o.crit) { markCrit(L(o.crit)); say(L(o.crit), 'bad'); }
      s.extracted = true; s.inWater = false;
      progressBar(L(G.extracting), o.secs, () => { s.phase = 'pa'; startPA(); });
    });
  }

  /* ---------- overlays ---------- */
  function overlayBox() { let el = root.querySelector('.g-overlay'); if (!el) { el = document.createElement('div'); el.className = 'g-overlay'; root.querySelector('.g-stage').appendChild(el); } return el; }
  function closeOverlay() { const el = root.querySelector('.g-overlay'); if (el) el.remove(); st.paused = false; }
  function choice(title, opts, cb) {
    st.paused = true;
    const el = overlayBox();
    const shuffled = opts.slice().sort(() => Math.random() - 0.5);
    el.innerHTML = '<div class="g-card"><h3>' + esc(title) + '</h3><div class="options">' + shuffled.map((o, i) => '<button class="opt" data-i="' + i + '">' + esc(L(o.t)) + '</button>').join('') + '</div></div>';
    el.querySelectorAll('[data-i]').forEach((b) => b.onclick = () => { closeOverlay(); cb(shuffled[+b.dataset.i]); });
  }
  function progressBar(label, secs, done) {
    st.paused = true;
    const el = overlayBox();
    el.innerHTML = '<div class="g-card"><p class="step-text">' + esc(label) + '</p><div class="progressbar"><span id="g-pb" style="width:0%"></span></div></div>';
    const t0 = performance.now();
    const tick = () => { const k = clamp((performance.now() - t0) / (secs * 1000), 0, 1); const bar = document.getElementById('g-pb'); if (bar) bar.style.width = Math.round(k * 100) + '%'; if (k < 1) requestAnimationFrame(tick); else { st.t += secs; closeOverlay(); done(); } };
    requestAnimationFrame(tick);
  }

  /* ---------- dibujo ---------- */
  function draw() {
    const s = st, c = ctx; const m = s.sc.map;
    c.clearRect(0, 0, W, H);
    if (m === 'pool') drawPool(); else drawShore(m === 'lake');
    // tubo
    if (!s.tube.taken) { c.save(); c.translate(s.tube.x, s.tube.y); c.rotate(-0.6); c.fillStyle = '#D7263D'; c.fillRect(-16, -4, 32, 8); c.restore(); }
    // DESA en el borde
    if (s.desaHere) { const d = desaSpot(); c.fillStyle = '#1D8A4A'; c.fillRect(d.x - 9, d.y - 7, 18, 14); c.fillStyle = '#fff'; c.font = 'bold 9px sans-serif'; c.textAlign = 'center'; c.fillText('DESA', d.x, d.y + 3); }
    // compañero
    if (s.partnerHere) { const d = desaSpot(); drawPerson(d.x + 28, d.y, '#F2C94C', '#E3A857', false); }
    // víctima
    const v = s.victim;
    drawVictim(v);
    // jugador
    drawPerson(s.player.x, s.player.y, '#D7263D', '#F0B48F', s.hasTube || (s.sc.boya && s.tube.taken));
    if (s.t < s.grabbedUntil) { c.strokeStyle = '#D7263D'; c.lineWidth = 2; c.beginPath(); c.arc(s.player.x, s.player.y, 18, 0, Math.PI * 2); c.stroke(); }
  }
  function desaSpot() { return st.sc.map === 'pool' ? P.desaPool : P.desaShore; }
  function drawPool() {
    const c = ctx;
    c.fillStyle = '#E8DCC2'; c.fillRect(0, 0, W, H);                       // playa de la piscina
    c.fillStyle = '#CFE0E6'; c.fillRect(POOL.x - 8, POOL.y - 8, POOL.w + 16, POOL.h + 16);
    const grd = c.createLinearGradient(POOL.x, 0, POOL.x + POOL.w, 0); grd.addColorStop(0, '#6EC1E4'); grd.addColorStop(1, '#2B8BC2');
    c.fillStyle = grd; c.fillRect(POOL.x, POOL.y, POOL.w, POOL.h);
    c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 2;
    for (let i = 1; i < 6; i++) { const y = POOL.y + (POOL.h / 6) * i; c.setLineDash([6, 6]); c.beginPath(); c.moveTo(POOL.x, y); c.lineTo(POOL.x + POOL.w, y); c.stroke(); }
    c.setLineDash([]);
    c.fillStyle = '#10232B'; c.font = 'bold 12px sans-serif'; c.textAlign = 'left';
    c.fillText('1,20 m', POOL.x + 8, POOL.y + 16); c.textAlign = 'right'; c.fillText('2,20 m', POOL.x + POOL.w - 8, POOL.y + 16);
    // silla
    c.fillStyle = '#0B4F6C'; c.fillRect(P.chair.x, P.chair.y, 26, 26); c.fillStyle = '#fff'; c.font = '9px sans-serif'; c.textAlign = 'center'; c.fillText('SOS', P.chair.x + 13, P.chair.y + 17);
    // enfermería
    const n = P.nurse; c.fillStyle = '#fff'; c.fillRect(n.x, n.y, n.w, n.h); c.strokeStyle = '#D7263D'; c.lineWidth = 3; c.strokeRect(n.x, n.y, n.w, n.h);
    c.fillStyle = '#D7263D'; c.fillRect(n.x + n.w / 2 - 5, n.y + 10, 10, 20); c.fillRect(n.x + n.w / 2 - 10, n.y + 15, 20, 10);
  }
  function drawShore(lake) {
    const c = ctx;
    const grd = c.createLinearGradient(0, 0, 0, SHORE_Y); grd.addColorStop(0, lake ? '#245C6B' : '#1F7FB8'); grd.addColorStop(1, lake ? '#3C8A96' : '#5FBBE0');
    c.fillStyle = grd; c.fillRect(0, 0, W, SHORE_Y);
    c.fillStyle = lake ? '#9DB38A' : '#EBD9A8'; c.fillRect(0, SHORE_Y, W, H - SHORE_Y);
    c.fillStyle = lake ? '#7F9A72' : '#D9C48F'; c.fillRect(0, SHORE_Y, W, DRY_Y - SHORE_Y);
    if (st.sc.rip) { c.fillStyle = 'rgba(255,255,255,0.14)'; c.fillRect(RIP.x, 0, RIP.w, SHORE_Y); c.fillStyle = 'rgba(255,255,255,0.7)'; c.font = '11px sans-serif'; c.textAlign = 'center'; c.fillText('↑ ' + L(G.ripLabel) + ' ↑', RIP.x + RIP.w / 2, 20); }
    c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 2;
    for (let i = 0; i < 4; i++) { const y = SHORE_Y - 10 - i * 60 + Math.sin(st.t * 2 + i) * 3; c.beginPath(); for (let x = 0; x <= W; x += 20) c.lineTo(x, y + Math.sin((x + st.t * 60) / 25) * 3); c.stroke(); }
    if (lake) { c.fillStyle = '#4F6F45'; for (let i = 0; i < Math.floor(W / 140); i++) { c.beginPath(); c.arc(60 + i * 140, H - 30, 12, 0, Math.PI * 2); c.fill(); } }
    // puesto
    c.fillStyle = '#0B4F6C'; c.fillRect(P.puesto.x, P.puesto.y, 34, 30); c.fillStyle = '#fff'; c.font = '9px sans-serif'; c.textAlign = 'center'; c.fillText('SOS', P.puesto.x + 17, P.puesto.y + 19);
    if (!lake) { c.fillStyle = '#E9B51C'; c.fillRect(P.flag.x, P.flag.y, 3, 30); c.fillRect(P.flag.x + 3, P.flag.y, 14, 9); }
  }
  function drawPerson(x, y, cap, skin, tube) {
    const c = ctx;
    if (tube) { c.save(); c.translate(x - 14, y); c.rotate(0.3); c.fillStyle = '#D7263D'; c.fillRect(-14, -3, 28, 6); c.restore(); }
    c.fillStyle = skin; c.beginPath(); c.arc(x, y, 11, 0, Math.PI * 2); c.fill();
    c.fillStyle = cap; c.beginPath(); c.arc(x, y - 2, 8, Math.PI, 0); c.fill();
    c.fillStyle = skin; c.fillRect(x - 17, y - 3, 6, 6); c.fillRect(x + 11, y - 3, 6, 6);
  }
  function drawVictim(v) {
    const c = ctx;
    c.save(); c.translate(v.x, v.y);
    if (v.convulsing > 0) c.rotate(Math.sin(st.t * 25) * 0.25);
    c.fillStyle = v.faceUp ? '#F0B48F' : '#5A3C2E';
    c.beginPath(); c.arc(0, 0, 12, 0, Math.PI * 2); c.fill();
    if (v.faceUp) { c.fillStyle = '#10232B'; c.fillRect(-5, -3, 2, 2); c.fillRect(3, -3, 2, 2); c.fillRect(-3, 4, 6, 1.5); }
    c.fillStyle = v.faceUp ? '#F0B48F' : '#5A3C2E';
    if (v.conscious && !st.contact) { const a = Math.sin(st.t * 6) * 6; c.fillRect(-22, -4 - a, 8, 6); c.fillRect(14, -4 + a, 8, 6); }
    else { c.fillRect(-20, -2, 8, 6); c.fillRect(12, -2, 8, 6); }
    c.restore();
    if (!st.contact && v.conscious) { c.fillStyle = '#10232B'; c.font = 'bold 11px sans-serif'; c.textAlign = 'center'; c.fillText(L(G.riaLabel), v.x, v.y - 20); }
  }

  /* ---------- HUD ---------- */
  function updateHud() {
    const s = st, v = s.victim; if (!root) return;
    const hud = root.querySelector('.g-hud'); if (!hud) return;
    const bar = (label, val, cls) => '<div class="g-bar ' + cls + '"><span>' + esc(label) + '</span><i><b style="width:' + Math.round(val) + '%"></b></i></div>';
    hud.innerHTML = '<div class="g-time">' + fmt(s.t) + '</div>' +
      bar(L(G.o2), v.o2, v.o2 < 30 ? 'red' : (v.o2 < 60 ? 'yellow' : 'green')) +
      (v.conscious && !s.contact ? bar(L(G.fatigue), v.fatigue, v.fatigue < 30 ? 'red' : 'yellow') : '') +
      bar(L(G.temp), v.temp, v.temp < 40 ? 'red' : (v.temp < 70 ? 'yellow' : 'green')) +
      '<div class="g-status">' + (s.signalAt === null ? '<em>' + esc(L(G.noSignal)) + '</em>' : (s.partnerHere ? '✔ ' : '⏳ ') + esc(L(G.partner)) + ' · ' + (s.desaHere ? '✔ ' : '⏳ ') + 'DESA') + '</div>';
    const sb = root.querySelector('[data-signal]'); if (sb) sb.disabled = s.signalAt !== null;
  }
  function updateLog() {
    const el = root && root.querySelector('.g-log'); if (!el) return;
    el.innerHTML = st.msg.map((m) => '<p class="' + m.kind + '"><span>' + fmt(m.t) + '</span> ' + esc(m.txt) + '</p>').join('');
  }

  /* ---------- fase PA ---------- */
  function startPA() {
    const s = st; running = false; cancelAnimationFrame(raf);
    s.paStart = s.t;
    if (s.sc.pa === 'pcr') pcrFlow(); else decisionsFlow();
  }

  function paShell(inner) {
    const stage = root.querySelector('.g-stage');
    stage.innerHTML = '<div class="g-pa">' + inner + '</div>';
    return stage.querySelector('.g-pa');
  }
  function paHud() {
    const v = st.victim;
    const bar = (label, val, cls) => '<div class="g-bar ' + cls + '"><span>' + esc(label) + '</span><i><b style="width:' + Math.round(val) + '%"></b></i></div>';
    return '<div class="g-pahud"><div class="g-time">' + fmt(st.t) + '</div>' + bar(L(G.o2), v.o2, v.o2 < 30 ? 'red' : (v.o2 < 60 ? 'yellow' : 'green')) + bar(L(G.temp), v.temp, v.temp < 40 ? 'red' : (v.temp < 70 ? 'yellow' : 'green')) + '</div>';
  }
  function paChoice(title, opts, cb, secs) {
    const shuffled = opts.slice().sort(() => Math.random() - 0.5);
    const el = paShell(paHud() + '<div class="g-card wide"><h3>' + esc(title) + '</h3>' + (secs ? '<div class="progressbar"><span id="g-timer" style="width:100%"></span></div>' : '') + '<div class="options">' + shuffled.map((o, i) => '<button class="opt" data-i="' + i + '">' + esc(L(o.t)) + '</button>').join('') + '</div><div class="g-fb" id="g-fb"></div></div>');
    let timer = null;
    if (secs) {
      const t0 = performance.now();
      const tick = () => { const k = clamp(1 - (performance.now() - t0) / (secs * 1000), 0, 1); const b = document.getElementById('g-timer'); if (!b) return; b.style.width = Math.round(k * 100) + '%'; st.victim.o2 -= 0.4 * (1 / 60); if (k > 0) timer = requestAnimationFrame(tick); else { st.victim.o2 -= 6; st.t += secs; markWrong(); showFb(L(G.timeout), 'yellow', () => cb({ timeout: true })); } };
      timer = requestAnimationFrame(tick);
    }
    el.querySelectorAll('[data-i]').forEach((b) => b.onclick = () => { if (timer) cancelAnimationFrame(timer); st.t += 3; cb(shuffled[+b.dataset.i]); });
  }
  function showFb(text, cls, next) {
    const fb = document.getElementById('g-fb');
    if (!fb) { next(); return; }
    fb.innerHTML = '<div class="feedback ' + cls + '"><p>' + esc(text) + '</p><button class="btn" id="g-next">' + esc(L(UI.continue)) + '</button></div>';
    document.getElementById('g-next').onclick = next;
    root.querySelectorAll('.g-pa .opt').forEach((b) => b.disabled = true);
  }
  function handle(o, okText, next) {
    if (o.crit) { markCrit(L(o.crit)); st.victim.o2 -= 10; showFb(L(UI.critical) + ': ' + L(o.crit), 'red', next); }
    else if (o.wrong) { markWrong(); st.victim.o2 -= 4; st.t += 6; showFb(L(o.wrong), 'yellow', next); }
    else showFb(okText, 'green', next);
  }

  /* ---- decisiones cronometradas (reutiliza los pasos del caso) ---- */
  function decisionsFlow() {
    const c = caseOf(st.sc); const steps = c.pa.slice(); let i = 0;
    const step = () => {
      if (i >= steps.length) { finishGame(); return; }
      const stp = steps[i];
      const opts = [{ t: stp.t, ok: true, why: stp.why }].concat((stp.alts || []).map((a) => a.crit ? { t: a.t, crit: a.why } : { t: a.t, wrong: a.why }));
      paChoice(L(UI.whatNow) + ' (' + (i + 1) + '/' + steps.length + ')', opts, (o) => {
        if (o.timeout) { i++; step(); return; }
        if (o.ok && /manta|abr[ií]g|abriga/i.test(L(stp.t))) st.victim.temp = Math.min(100, st.victim.temp + 25);
        handle(o, L(stp.why), () => { i++; step(); });
      }, 25);
    };
    step();
  }

  /* ---- vía PCR: mini-juegos ---- */
  function pcrFlow() {
    const sc = st.sc, v = st.victim;
    v.breathing = false;
    const q = [];
    // 1. consciencia (+ en tierra: pedir ayuda)
    q.push((next) => paChoice(L(G.pcrConscTitle), [
      { t: G.pcrConscOk, ok: true }, { t: G.pcrConscCompress, wrong: G.pcrConscCompressWhy }, { t: G.pcrConscHeimlich, crit: G.critHeimlich }, { t: G.pcrConscPLS, crit: G.critPLS }
    ], (o) => handle(o, L(G.pcrConscOkWhy), next)));
    if (sc.land) q.push((next) => paChoice(L(G.pcrHelpTitle), [
      { t: G.pcrHelpOk, ok: true }, { t: G.pcrHelpNone, wrong: G.pcrHelpNoneWhy }, { t: G.pcrHelpGo, wrong: G.pcrHelpGoWhy }
    ], (o) => { if (o.ok || o.wrong) { st.signalAt = st.t; st.desaAt = st.t + (o.ok ? 45 : 70); st.desaHere = false; } handle(o, L(G.pcrHelpOkWhy), next); }));
    // 2. vía aérea
    q.push((next) => paChoice(L(G.pcrAirwayTitle), sc.cervical
      ? [{ t: G.airJaw, ok: true }, { t: G.airHeadTilt, wrong: G.airHeadTiltLmWhy }, { t: G.airGuedelFirst, wrong: G.airGuedelWhy }]
      : [{ t: G.airHeadTiltCerv, ok: true }, { t: G.airHyper, wrong: G.airHyperWhy }, { t: G.airGuedelFirst, wrong: G.airGuedelWhy }],
      (o) => handle(o, L(sc.cervical ? G.airJawWhy : G.airHeadTiltCervWhy), next)));
    // 3. VOS (mantener pulsado ≤10 s)
    q.push((next) => vosGame(next));
    // 4. 5 insuflaciones o 30:2 directo
    q.push((next) => paChoice(L(G.pcrStartTitle), sc.drowning
      ? [{ t: G.startFive, ok: true }, { t: G.startCompress, wrong: G.startCompressWhy }, { t: G.startTwo, wrong: G.startTwoWhy }, { t: G.startDrain, crit: G.critDrain }]
      : [{ t: G.startCompress, ok: true }, { t: G.startFive, wrong: G.startFiveLandWhy }, { t: G.startPLS, crit: G.critPLS }],
      (o) => { st.startChoice = o; handle(o, L(sc.drowning ? G.startFiveWhy : G.startCompressWhy2), next); }));
    q.push((next) => { if (sc.drowning && !(st.startChoice && st.startChoice.crit)) ventGame(5, next); else next(); });
    // 5. RCP + DESA
    q.push((next) => cprGame(next));
    // 6. tras recuperar
    q.push((next) => paChoice(L(G.afterTitle), sc.cervical
      ? [{ t: G.afterSupineCerv, ok: true }, { t: G.afterPLS, crit: G.critPLSLm }, { t: G.afterDrink, crit: G.critDrink }]
      : [{ t: G.afterPLS, ok: true }, { t: G.afterDrink, crit: G.critDrink }, { t: G.afterLeave, wrong: G.afterLeaveWhy }],
      (o) => { if (o.ok) v.temp = Math.min(100, v.temp + 25); handle(o, L(sc.cervical ? G.afterSupineCervWhy : G.afterPLSWhy), () => { finishGame(); }); }));
    let i = 0; const run = () => { if (i < q.length) q[i++](run); }; run();
  }

  function vosGame(next) {
    const el = paShell(paHud() + '<div class="g-card wide"><h3>' + esc(L(G.vosTitle)) + '</h3><p>' + esc(L(G.vosHint)) + '</p><button class="btn g-hold" id="g-vos">' + esc(L(G.vosBtn)) + '</button><div class="progressbar"><span id="g-vosbar" style="width:0%"></span></div><p class="muted small" id="g-vossec">0,0 s</p><div class="g-fb" id="g-fb"></div></div>');
    const btn = el.querySelector('#g-vos'); let t0 = 0, rafId = 0, done = false;
    const tick = () => { if (!t0 || done) return; const e = (performance.now() - t0) / 1000; const b = document.getElementById('g-vosbar'); if (b) b.style.width = Math.round(Math.min(100, e * 10)) + '%'; const sec = document.getElementById('g-vossec'); if (sec) sec.textContent = e.toFixed(1).replace('.', ',') + ' s'; if (e >= 10) { stop(); return; } rafId = requestAnimationFrame(tick); };
    const stop = () => { if (done || !t0) return; done = true; cancelAnimationFrame(rafId); const e = (performance.now() - t0) / 1000; st.t += e; btn.disabled = true;
      if (e > 10) { markWrong(); st.victim.o2 -= 4; showFb(L(G.vosTooLong), 'yellow', next); } else if (e < 2) { markWrong(); showFb(L(G.vosTooShort), 'yellow', next); } else showFb(L(G.vosResult), 'green', next); };
    btn.onpointerdown = (e) => { e.preventDefault(); if (t0) return; t0 = performance.now(); btn.classList.add('listening'); rafId = requestAnimationFrame(tick); };
    btn.onpointerup = btn.onpointerleave = btn.onpointercancel = () => { if (t0 && !done) { btn.classList.remove('listening'); stop(); } };
  }

  function ventGame(count, next, after) {
    const el = paShell(paHud() + '<div class="g-card wide"><h3>' + esc(count === 5 ? L(G.ventTitle5) : L(G.ventTitle2)) + '</h3><p>' + esc(L(G.ventHint)) + '</p>' +

        html += '<li>' + m[1] + '</li>'; continue;
      }
      closeList(); para.push(line);
    }
    flushPara(); closeList();
    return html;
  }

  /* ---------- progress ---------- */
  const emptyProgress = () => ({ v: 1, name: '', cases: {}, exams: [], dialogs: {}, games: {}, updatedAt: 0 });

  function loadLocal() {
    try { const raw = ls.get('scv-progress'); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }

  async function initProgress() {
    S.progress = loadLocal() || emptyProgress();
    if (!HAS_RUNTIME) return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (db && user) {
        const me = await user.me();
        S.accountName = me.name || ''; S.avatarUrl = me.avatarUrl || '';
        const uid = me.id;
        if (uid) {
          S.db = db; S.uid = uid;
          const ref = db.doc('data/users/' + uid + '/progress');
          const snap = await ref.get();
          const remote = snap.exists ? snap.data() : null;
          if (remote && (remote.updatedAt || 0) >= (S.progress.updatedAt || 0)) {
            S.progress = Object.assign(emptyProgress(), remote);
            ls.set('scv-progress', JSON.stringify(S.progress));
          } else if (S.progress.updatedAt) {
            await ref.set(S.progress);
          }
          S.dbReady = true; S.storageMode = 'cloud';
        }
      }
    } catch (e) { /* stay local */ }
    const v = route().view;
    if (v === 'progress' || v === 'cases') render(); else renderTop();
  }

  let saving = Promise.resolve();
  function saveProgress() {
    S.progress.updatedAt = Date.now();
    const snapshot = JSON.parse(JSON.stringify(S.progress));
    ls.set('scv-progress', JSON.stringify(snapshot));
    if (S.dbReady) {
      saving = saving.then(() => S.db.doc('data/users/' + S.uid + '/progress').set(snapshot)).catch(() => { S.storageMode = 'local-error'; });
    }
  }

  function recordCase(caseId, score, flag, critSteps) {
    const p = S.progress;
    const c = p.cases[caseId] || { attempts: 0, best: 0, lastFlag: null, lastAt: 0, critical: [] };
    c.attempts += 1; c.best = Math.max(c.best, score); c.lastFlag = flag; c.lastAt = Date.now();
    const seen = new Set(c.critical);
    critSteps.forEach((t) => { if (!seen.has(t)) { seen.add(t); c.critical.push(t); } });
    c.critical = c.critical.slice(-12);
    p.cases[caseId] = c;
    saveProgress();
  }
  function recordGame(id, score, flag, critSteps) {
    const p = S.progress; p.games = p.games || {};
    const g = p.games[id] || { attempts: 0, best: 0, lastFlag: null, lastAt: 0, critical: [] };
    g.attempts += 1; g.best = Math.max(g.best, score); g.lastFlag = flag; g.lastAt = Date.now();
    const seen = new Set(g.critical); critSteps.forEach((t) => { if (!seen.has(t)) { seen.add(t); g.critical.push(t); } }); g.critical = g.critical.slice(-12);
    p.games[id] = g; saveProgress();
  }
  function recordExam(n, score, invalid) {
    S.progress.exams.push({ at: Date.now(), n, score, invalid });
    S.progress.exams = S.progress.exams.slice(-30);
    saveProgress();
  }
  function recordDialog(caseId, score) {
    S.progress.dialogs[caseId] = (S.progress.dialogs[caseId] || 0) + 1;
    if (typeof score === 'number') {
      S.progress.dialogScores = S.progress.dialogScores || {};
      S.progress.dialogScores[caseId] = Math.max(S.progress.dialogScores[caseId] || 0, score);
    }
    saveProgress();
  }

  /* ---------- flag ---------- */
  const flagOf = (score, crit) => crit > 0 ? 'red' : (score >= 6 ? 'green' : 'yellow');
  const flagHtml = (flag, cls) => '<span class="flag ' + flag + ' ' + (cls || '') + '" aria-hidden="true"></span>';

  /* ---------- router ---------- */
  function route() {
    const h = location.hash.replace('#', '') || 'cases';
    const [view, arg] = h.split('/');
    return { view, arg };
  }
  window.addEventListener('hashchange', render);

  function go(hash) { if (location.hash !== '#' + hash) location.hash = hash; else render(); }

  /* ---------- header ---------- */
  function renderTop() {
    const { view } = route();
    const tabs = [['cases', UI.nav.cases], ['game', UI.nav.game], ['exam', UI.nav.exam], ['dialog', UI.nav.dialog], ['progress', UI.nav.progress]];
    const active = view === 'case' ? 'cases' : view;
    $top.innerHTML =
      '<div class="brand"><h1>' + esc(L(UI.appName)) + '</h1><p>' + esc(L(UI.tagline)) + (userName() ? ' · ' + esc(L(UI.hello)) + ', ' + esc(userName()) : '') + '</p></div>' +
      '<div class="controls">' +
        '<div class="lang" role="group" aria-label="Idioma">' +
          '<button data-lang="es" class="' + (S.lang === 'es' ? 'on' : '') + '">ES</button>' +
          '<button data-lang="va" class="' + (S.lang === 'va' ? 'on' : '') + '">VA</button>' +
        '</div>' +
        '<button class="theme" data-theme-toggle aria-label="' + esc(L(UI.theme)) + '" title="' + esc(L(UI.theme)) + '">' +
          '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="currentColor"/></svg>' +
        '</button>' +
      '</div>' +
      '<nav class="tabs" aria-label="Secciones">' + tabs.map(([k, t]) => '<a href="#' + k + '" class="' + (active === k ? 'on' : '') + '">' + esc(L(t)) + '</a>').join('') + '</nav>';
  }

  $top.addEventListener('click', (e) => {
    const lb = e.target.closest('[data-lang]');
    if (lb) { S.lang = lb.dataset.lang; ls.set('scv-lang', S.lang); document.documentElement.lang = S.lang === 'va' ? 'ca' : 'es'; render(); return; }
    if (e.target.closest('[data-theme-toggle]')) {
      const cur = document.documentElement.getAttribute('data-theme');
      const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = cur ? cur === 'dark' : sysDark;
      const next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next); ls.set('scv-theme', next);
    }
  });

  /* ---------- render ---------- */
  function render() {
    renderTop();
    const { view, arg } = route();
    window.scrollTo(0, 0);
    if (view !== 'game') GAME.stop();
    if (view === 'case' && arg) return renderCase(arg);
    if (view === 'game') return GAME.render($app, arg);
    if (view === 'exam') return renderExam();
    if (view === 'dialog') return renderDialog(arg);
    if (view === 'progress') return renderProgress();
    return renderCases();
  }

  /* ========== CASES LIST ========== */
  function renderCases() {
    const chips = (items, cur, key) => items.map(([k, lab]) => '<button class="chip ' + (cur === k ? 'on' : '') + '" data-' + key + '="' + k + '">' + esc(lab) + '</button>').join('');
    const envChips = chips([['all', L(UI.allEnv)]].concat(ENV_ORDER.map((k) => [k, L(UI.env[k])])), S.filterEnv, 'env');
    const sitChips = chips([['all', L(UI.allSit)]].concat(SIT_ORDER.map((k) => [k, L(UI.sit[k])])), S.filterSit, 'sit');
    const list = CASES.filter((c) => (S.filterEnv === 'all' || c.env === S.filterEnv) && (S.filterSit === 'all' || c.sit === S.filterSit || (c.tags || []).includes(S.filterSit)));
    const cards = list.map((c) => {
      const pr = S.progress.cases[c.id];
      const status = pr ? flagHtml(pr.lastFlag || flagOf(pr.best, 0)) + '<span>' + esc(L(UI.best)) + ' ' + fmtNum(pr.best) + ' · ' + pr.attempts + ' ' + esc(L(UI.attempts)) + '</span>'
                        : '<span class="muted">' + esc(L(UI.notDone)) + '</span>';
      return '<a class="case-card" href="#case/' + c.id + '">' +
        '<div class="meta"><span>' + esc(L(UI.env[c.env])) + '</span><span>' + esc(L(UI.sit[c.sit])) + '</span>' + (c.rescue ? '<span class="pill">' + esc(L(UI.rescuePhase)) + ' + PA</span>' : '<span class="pill">PA</span>') + '</div>' +
        '<h3>' + esc(L(c.title)) + '</h3>' +
        '<p>' + esc(L(c.victim)) + '</p>' +
        '<div class="status">' + status + '</div>' +
      '</a>';
    }).join('');
    $app.innerHTML =
      '<section class="filters"><div class="chips">' + envChips + '</div><div class="chips">' + sitChips + '</div></section>' +
      '<div class="toolbar"><button class="btn ghost" data-random>' + esc(L(UI.randomCase)) + '</button></div>' +
      '<section class="case-grid">' + (cards || '<p class="muted">—</p>') + '</section>';
    $app.querySelector('[data-random]').onclick = () => { const pick = list.length ? list : CASES; go('case/' + pick[Math.floor(Math.random() * pick.length)].id); };
    $app.querySelectorAll('[data-env]').forEach((b) => b.onclick = () => { S.filterEnv = b.dataset.env; renderCases(); });
    $app.querySelectorAll('[data-sit]').forEach((b) => b.onclick = () => { S.filterSit = b.dataset.sit; renderCases(); });
  }

  /* ========== CHECKLIST CASE ========== */
  function buildSteps(c, scope) {
    let steps = [];
    if (scope === 'full' && c.rescue) steps = steps.concat(c.rescue.map((s) => Object.assign({ phase: 'rescue' }, s)));
    else if (c.paPrefix) steps = steps.concat(c.paPrefix.map((s) => Object.assign({ phase: 'pa' }, s)));
    steps = steps.concat(c.pa.map((s) => Object.assign({ phase: 'pa' }, s)));
    return steps;
  }

  function startSession(c, scope) {
    const steps = buildSteps(c, scope);
    S.session = { caseId: c.id, scope, steps, idx: 0, results: [], options: null, picked: null, done: false };
    prepareOptions();
    renderCase(c.id);
  }

  function prepareOptions() {
    const s = S.session; const step = s.steps[s.idx];
    let opts = [{ kind: 'ok', t: step.t, why: step.why }];
    (step.alts || []).forEach((a) => opts.push({ kind: a.crit ? 'crit' : 'wrong', t: a.t, why: a.why }));
    if (opts.length < 3) {
      const future = s.steps[s.idx + 1] || s.steps[s.idx + 2];
      if (future) opts.push({ kind: 'later', t: future.t, why: null });
    }
    s.options = shuffle(opts); s.picked = null;
  }

  function renderCase(id) {
    const c = caseById(id);
    if (!c) return go('cases');
    const s = S.session && S.session.caseId === id ? S.session : null;
    if (!s) return renderCaseIntro(c);
    if (s.done) return renderCaseResult(c, s);
    renderCasePlay(c, s);
  }

  function renderCaseIntro(c) {
    const hasRescue = !!c.rescue;
    const scopes = hasRescue
      ? '<div class="scope" role="group"><button class="btn" data-scope="full">' + esc(L(UI.scope.full)) + '</button><button class="btn ghost" data-scope="pa">' + esc(L(UI.scope.pa)) + '</button></div>'
      : '<div class="scope"><button class="btn" data-scope="pa">' + esc(L(UI.start)) + '</button></div>';
    const pr = S.progress.cases[c.id];
    $app.innerHTML =
      '<a class="back" href="#cases">← ' + esc(L(UI.backToCases)) + '</a>' +
      '<article class="case-head">' +
        '<div class="meta"><span>' + esc(L(UI.env[c.env])) + '</span><span>' + esc(L(UI.sit[c.sit])) + '</span></div>' +
        '<h2>' + esc(L(c.title)) + '</h2>' +
        '<p class="victim">' + esc(L(UI.victim)) + ': ' + esc(L(c.victim)) + '</p>' +
        '<div class="scene"><h3>' + esc(L(UI.scene)) + '</h3><p>' + esc(L(c.scene)) + '</p></div>' +
        (pr ? '<p class="muted small">' + flagHtml(pr.lastFlag || 'green', 'inline') + esc(L(UI.best)) + ' ' + fmtNum(pr.best) + ' · ' + pr.attempts + ' ' + esc(L(UI.attempts)) + '</p>' : '') +
        (hasRescue ? '<p class="hint">' + esc(L(UI.scope.pa)) + ': ' + esc(L(UI.scopeHint)) + '</p>' : '') +
        scopes +
      '</article>';
    $app.querySelectorAll('[data-scope]').forEach((b) => b.onclick = () => startSession(c, b.dataset.scope));
  }

  function stepLine(st, r, n) {
    const flag = r ? (r.status === 'ok' ? 'green' : (r.status === 'crit' ? 'red' : 'yellow')) : 'none';
    return '<li class="step done ' + flag + '">' +
      '<div class="marker">' + flagHtml(flag) + '<span class="num">' + n + '</span></div>' +
      '<div class="body"><p class="step-text">' + esc(L(st.t)) + '</p>' +
      (r && r.status !== 'ok' ? '<p class="picked"><strong>' + esc(L(UI.yourAnswer)) + ':</strong> ' + esc(L(r.pickedText)) + '</p>' : '') +
      '<p class="why">' + esc(L(st.why)) + (st.ref ? ' <span class="ref">' + esc(L(UI.source)) + ': ' + esc(st.ref) + '</span>' : '') + '</p></div></li>';
  }

  function renderCasePlay(c, s) {
    const step = s.steps[s.idx];
    const sceneText = (s.scope === 'pa' && c.scenePA) ? L(c.scenePA) : L(c.scene);
    const doneHtml = s.steps.slice(0, s.idx).map((st, i) => stepLine(st, s.results[i], i + 1)).join('');
    const phaseLabel = (i) => {
      const st = s.steps[i]; const prev = s.steps[i - 1];
      if (!prev || prev.phase !== st.phase) return '<li class="phase">' + esc(L(st.phase === 'rescue' ? UI.rescuePhase : UI.paPhase)) + '</li>';
      return '';
    };
    // phase labels interleaved
    let timeline = '';
    for (let i = 0; i < s.idx; i++) timeline += phaseLabel(i) + stepLine(s.steps[i], s.results[i], i + 1);
    timeline += phaseLabel(s.idx);

    let current;
    if (s.picked === null) {
      current = '<li class="step current"><div class="marker">' + flagHtml('none') + '<span class="num">' + (s.idx + 1) + '</span></div>' +
        '<div class="body"><p class="ask">' + esc(L(UI.whatNow)) + '</p><div class="options">' +
        s.options.map((o, i) => '<button class="opt" data-opt="' + i + '">' + esc(L(o.t)) + '</button>').join('') +
        '</div></div></li>';
    } else {
      const o = s.options[s.picked];
      const r = s.results[s.idx];
      const flag = r.status === 'ok' ? 'green' : (r.status === 'crit' ? 'red' : 'yellow');
      const head = r.status === 'ok' ? L(UI.correct) : (r.status === 'crit' ? L(UI.critical) : (r.status === 'later' ? L(UI.notYet) : L(UI.wrong)));
      current = '<li class="step current ' + flag + '"><div class="marker">' + flagHtml(flag) + '<span class="num">' + (s.idx + 1) + '</span></div>' +
        '<div class="body"><div class="feedback ' + flag + '"><p class="fb-head">' + esc(head) + '</p>' +
        (r.status !== 'ok' ? '<p class="picked"><strong>' + esc(L(UI.yourAnswer)) + ':</strong> ' + esc(L(o.t)) + '</p>' + (o.why ? '<p>' + esc(L(o.why)) + '</p>' : '') + '<p class="right"><strong>' + esc(L(UI.theRightOne)) + '</strong> ' + esc(L(step.t)) + '</p>' : '<p class="step-text">' + esc(L(step.t)) + '</p>') +
        '<p class="why">' + esc(L(step.why)) + (step.ref ? ' <span class="ref">' + esc(L(UI.source)) + ': ' + esc(step.ref) + '</span>' : '') + '</p></div>' +
        '<button class="btn" data-next>' + esc(s.idx + 1 >= s.steps.length ? L(UI.finish) : L(UI.continue)) + '</button></div></li>';
    }
    const nCrit = s.results.filter((r) => r && r.status === 'crit').length;
    $app.innerHTML =
      '<a class="back" href="#cases">← ' + esc(L(UI.backToCases)) + '</a>' +
      '<article class="play">' +
        '<div class="meta"><span>' + esc(L(UI.env[c.env])) + '</span><span>' + esc(L(UI.sit[c.sit])) + '</span><span class="pill">' + esc(L(s.scope === 'full' ? UI.scope.full : UI.scope.pa)) + '</span></div>' +
        '<h2>' + esc(L(c.title)) + '</h2>' +
        '<details class="scene" open><summary>' + esc(L(UI.scene)) + '</summary><p>' + esc(sceneText) + '</p></details>' +
        '<div class="progressbar" aria-label="' + esc(L(UI.stepOf)) + ' ' + (s.idx + 1) + '/' + s.steps.length + '"><span style="width:' + Math.round(100 * s.idx / s.steps.length) + '%"></span></div>' +
        '<p class="counter">' + esc(L(UI.stepOf)) + ' ' + (s.idx + 1) + ' / ' + s.steps.length + (nCrit ? ' · <span class="crit">' + nCrit + ' ' + esc(L(UI.critCount)) + '</span>' : '') + '</p>' +
        '<ol class="timeline">' + timeline + current + '</ol>' +
      '</article>';
    $app.querySelectorAll('[data-opt]').forEach((b) => b.onclick = () => pick(+b.dataset.opt));
    const nextBtn = $app.querySelector('[data-next]');
    if (nextBtn) nextBtn.onclick = next;
    const cur = $app.querySelector('.step.current');
    if (cur && s.idx > 0) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function pick(i) {
    const s = S.session; const o = s.options[i];
    s.picked = i;
    s.results[s.idx] = { status: o.kind === 'ok' ? 'ok' : (o.kind === 'crit' ? 'crit' : (o.kind === 'later' ? 'later' : 'wrong')), pickedText: o.t };
    renderCase(s.caseId);
  }

  function next() {
    const s = S.session;
    if (s.idx + 1 >= s.steps.length) { finishSession(); return; }
    s.idx += 1; prepareOptions(); renderCase(s.caseId);
  }

  function finishSession() {
    const s = S.session; s.done = true;
    const ok = s.results.filter((r) => r.status === 'ok').length;
    const crit = s.results.filter((r) => r.status === 'crit').length;
    s.score = Math.round(100 * ok / s.steps.length) / 10;
    s.flag = flagOf(s.score, crit);
    s.ok = ok; s.crit = crit;
    recordCase(s.caseId, s.score, s.flag, s.results.map((r, i) => r.status === 'crit' ? L(s.steps[i].t) : null).filter(Boolean));
    renderCase(s.caseId);
  }

  function renderCaseResult(c, s) {
    const msg = s.flag === 'green' ? UI.flagGreen : (s.flag === 'red' ? UI.flagRed : UI.flagYellow);
    const lines = s.steps.map((st, i) => stepLine(st, s.results[i], i + 1)).join('');
    $app.innerHTML =
      '<a class="back" href="#cases">← ' + esc(L(UI.backToCases)) + '</a>' +
      '<article class="result ' + s.flag + '">' +
        '<h2>' + esc(L(UI.result)) + '</h2>' +
        '<div class="score-row">' + flagHtml(s.flag, 'big') +
          '<div><p class="score">' + esc(L(UI.grade)) + ' <strong>' + fmtNum(s.score) + '</strong>' + (s.flag === 'red' ? ' <span class="crit">(' + esc(L(UI.invalidTag)) + ')</span>' : '') + '</p>' +
          '<p>' + s.ok + '/' + s.steps.length + ' ' + esc(L(UI.firstTry)) + ' · ' + s.crit + ' ' + esc(L(UI.critCount)) + '</p></div></div>' +
        '<p class="verdict">' + esc(L(msg)) + '</p>' +
        '<div class="actions"><button class="btn" data-retry>' + esc(L(UI.retry)) + '</button><a class="btn ghost" href="#dialog/' + c.id + '">' + esc(L(UI.nav.dialog)) + '</a></div>' +
        (c.notes ? c.notes.map((n) => '<aside class="note"><strong>' + esc(L(UI.info)) + ':</strong> ' + esc(L(n)) + '</aside>').join('') : '') +
        '<h3>' + esc(L(UI.reviewSteps)) + '</h3><ol class="timeline review">' + lines + '</ol>' +
      '</article>';
    $app.querySelector('[data-retry]').onclick = () => { S.session = null; renderCaseIntro(c); };
  }

  /* ========== EXAM ========== */
  function renderExam() {
    const ex = S.exam;
    if (!ex) return renderExamIntro();
    if (ex.done) return renderExamResult();
    renderExamForm();
  }

  function renderExamIntro() {
    $app.innerHTML =
      '<article class="intro"><h2>' + esc(L(UI.nav.exam)) + '</h2><p>' + esc(L(UI.examIntro)) + '</p>' +
      '<p class="muted small">' + esc(L(UI.examMin)) + '</p>' +
      '<div class="actions"><button class="btn" data-n="10">' + esc(L(UI.examShort)) + '</button><button class="btn ghost" data-n="20">' + esc(L(UI.examLong)) + '</button></div></article>';
    $app.querySelectorAll('[data-n]').forEach((b) => b.onclick = () => startExam(+b.dataset.n));
  }

  function startExam(n) {
    const qs = shuffle(EXAM).slice(0, Math.min(n, EXAM.length)).map((q) => ({ q, opts: shuffle(q.opts), chosen: null }));
    S.exam = { n: qs.length, qs, done: false };
    renderExamForm();
  }

  function renderExamForm() {
    const ex = S.exam;
    $app.innerHTML =
      '<article class="exam">' +
        '<h2>' + esc(L(UI.nav.exam)) + ' · ' + ex.n + '</h2>' +
        ex.qs.map((it, qi) => '<fieldset class="q" id="q' + qi + '"><legend><span class="qn">' + (qi + 1) + '</span>' + esc(L(it.q.q)) + '</legend>' +
          it.opts.map((o, oi) => '<button class="opt ' + (it.chosen === oi ? 'on' : '') + '" data-q="' + qi + '" data-o="' + oi + '" aria-pressed="' + (it.chosen === oi) + '">' + esc(L(o.t)) + '</button>').join('') +
        '</fieldset>').join('') +
        '<p class="warn" id="exam-warn" hidden></p>' +
        '<div class="actions"><button class="btn" data-submit>' + esc(L(UI.examSubmit)) + '</button></div>' +
      '</article>';
    $app.querySelectorAll('[data-q]').forEach((b) => b.onclick = () => {
      const it = ex.qs[+b.dataset.q]; it.chosen = +b.dataset.o;
      const fs = b.closest('fieldset');
      fs.querySelectorAll('.opt').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
    });
    $app.querySelector('[data-submit]').onclick = () => {
      const missing = ex.qs.map((it, i) => it.chosen === null ? i : -1).filter((i) => i >= 0);
      if (missing.length) {
        const w = document.getElementById('exam-warn');
        w.hidden = false; w.textContent = L(UI.examUnanswered) + ': ' + missing.map((i) => i + 1).join(', ');
        document.getElementById('q' + missing[0]).scrollIntoView({ block: 'center', behavior: 'smooth' });
        return;
      }
      let ok = 0, invalid = false;
      ex.qs.forEach((it) => { const o = it.opts[it.chosen]; if (o.ok) ok++; if (o.d) invalid = true; });
      ex.score = Math.round(100 * ok / ex.n) / 10; ex.ok = ok; ex.invalid = invalid; ex.done = true;
      recordExam(ex.n, ex.score, invalid);
      renderExamResult();
    };
  }

  function renderExamResult() {
    const ex = S.exam;
    const flag = ex.invalid ? 'red' : (ex.score >= 6 ? 'green' : 'yellow');
    const verdict = ex.invalid ? L(UI.examInvalid) : (ex.score >= 6 ? L(UI.examPass) : L(UI.examFail));
    $app.innerHTML =

  /* ---------- voice (Web Speech API) ---------- */
  const voiceLang = () => (S.lang === 'va' ? 'ca-ES' : 'es-ES');
  function plainText(t) {
    return String(t).replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#{1,6}\s+/gm, '').replace(/^\s*(?:[-*•]|\d+[.)])\s+/gm, '').replace(/[«»"]/g, '').replace(/\n+/g, '. ');
  }
  function pickVoice(lang) {
    if (!synth) return null;
    const vs = synth.getVoices() || [];
    const norm = (v) => String(v.lang || '').replace('_', '-').toLowerCase();
    return vs.find((v) => norm(v) === lang.toLowerCase()) || vs.find((v) => norm(v).startsWith(lang.slice(0, 2).toLowerCase())) || null;
  }
  function stopSpeaking() { if (synth) { try { synth.cancel(); } catch (e) { /* ignore */ } } S.voice.speaking = -1; }
  function speak(text, idx) {
    if (!synth) { if (S.dlg) { S.dlg.error = L(UI.ttsUnavailable); renderDialogChat(); } return; }
    stopSpeaking();
    const u = new SpeechSynthesisUtterance(plainText(text));
    u.lang = voiceLang(); const v = pickVoice(u.lang); if (v) u.voice = v;
    u.rate = 1; u.pitch = 1;
    u.onstart = () => { S.voice.speaking = idx; markSpeaking(); };
    u.onend = u.onerror = () => { if (S.voice.speaking === idx) S.voice.speaking = -1; markSpeaking(); };
    synth.speak(u);
  }
  function markSpeaking() {
    document.querySelectorAll('[data-speak]').forEach((b) => {
      const on = +b.dataset.speak === S.voice.speaking;
      b.classList.toggle('on', on);
      b.textContent = on ? '■ ' + L(UI.stopListen) : '▶ ' + L(UI.listen);
    });
  }
  function unlockSynth() { if (synth) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } catch (e) { /* ignore */ } } }
  function toggleMic() {
    const d = S.dlg; if (!d) return;
    if (S.voice.listening) { try { S.voice.rec.stop(); } catch (e) { /* ignore */ } return; }
    if (!SR) { d.error = L(UI.micUnavailable); renderDialogChat(); return; }
    stopSpeaking();
    const rec = new SR();
    rec.lang = voiceLang(); rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    const base = (d.draft || '').trim();
    rec.onresult = (e) => {
      let t = '';
      for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      d.draft = (base ? base + ' ' : '') + t.trim();
      const inp = document.getElementById('inp'); if (inp) inp.value = d.draft;
    };
    rec.onerror = (e) => {
      S.voice.listening = false;
      const code = e && e.error;
      if (code === 'not-allowed' || code === 'service-not-allowed') d.error = L(UI.micDenied);
      else if (code !== 'no-speech' && code !== 'aborted') d.error = L(UI.micUnavailable);
      renderDialogChat();
    };
    rec.onend = () => { S.voice.listening = false; S.voice.rec = null; renderDialogChat(); };
    S.voice.rec = rec; S.voice.listening = true; d.error = null;
    try { rec.start(); renderDialogChat(); } catch (e) { S.voice.listening = false; S.voice.rec = null; d.error = L(UI.micUnavailable); renderDialogChat(); }
  }

  /* ---------- direct API fallback (GitHub Pages / fuera del visor) ---------- */
  function apiSampleShim(key, model) {
    return async (input, opts) => {
      opts = opts || {};
      const turns = Array.isArray(input) ? input : [{ role: 'user', content: String(input) }];
      const system = turns.length > 1 ? turns[0].content : undefined;
      const messages = (turns.length > 1 ? turns.slice(1) : turns).map((t) => ({ role: t.role, content: t.content }));
      let res;
      try {
        res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST', signal: opts.signal,
          headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify(Object.assign({ model, max_tokens: 1500, messages }, system ? { system } : {}))
        });
      } catch (e) {
        if (opts.signal && opts.signal.aborted) throw { code: 'cancelled', message: 'cancelled' };
        throw { code: 'upstream_error', message: String(e) };
      }
      if (!res.ok) {
        let msg = ''; try { msg = (await res.json()).error.message; } catch (e) { /* ignore */ }
        throw { code: res.status === 401 || res.status === 403 ? 'not_granted' : (res.status === 429 ? 'rate_limited' : 'upstream_error'), message: msg || String(res.status) };
      }
      const data = await res.json();
      const text = (data.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('\n').trim();
      if (!text) throw { code: 'empty_completion', message: 'empty' };
      if (opts.onText) opts.onText({ text, delta: text });
      return { text, truncated: data.stop_reason === 'max_tokens', modelTierApplied: 'default' };
    };
  }
  function applyApiKey() {
    const key = ls.get('scv-api-key'); const model = ls.get('scv-api-model') || API_DEFAULT_MODEL;
    if (key) { S.sample = apiSampleShim(key, model); S.apiMode = true; } else if (S.apiMode) { S.sample = null; S.apiMode = false; }
  }

  /* ========== DIALOGUE ========== */
  function dialogRules(c, scope) {

        'CAS: ' + L(c.title) + '\nVÍCTIMA: ' + L(c.victim) + '\nESCENA: ' + sceneText + '\nABAST: ' + L(scope === 'full' ? UI.scope.full : UI.scope.pa) + '\n\n' +

        'REGLES:\n' +
        '1. Respon sempre en valencià.\n' +
        '2. Sigues realista i concret: descriu només el que el socorrista podria percebre (el que veu, sent, toca, el que diuen els testimonis, el que respon la víctima). No dones dades que no haja explorat: si pregunta si respira, descriu el que observa en mirar, escoltar i sentir.\n' +
        '3. L\'estat de la víctima evoluciona segons les accions: si omet passos clau o tarda, empitjora; si actua bé, millora o s\'estabilitza. Indica el temps transcorregut aproximat quan siga rellevant.\n' +
        '4. Si el socorrista fa alguna cosa perillosa o incorrecta, mostra la conseqüència de forma realista sense dir que és incorrecte ni corregir.\n' +
        '5. No reveles el protocol, no dones pistes, no faces llistes d\'opcions i no avalues fins que et demanen l\'AVALUACIÓ FINAL.\n' +

    }

      'CASO: ' + L(c.title) + '\nVÍCTIMA: ' + L(c.victim) + '\nESCENA: ' + sceneText + '\nALCANCE: ' + L(scope === 'full' ? UI.scope.full : UI.scope.pa) + '\n\n' +
      'PROTOCOLO DE REFERENCIA (temario FSSCV/RFESS; solo para ti, no lo reveles):\n' + protocol + '\n\n' +
      (crit.length ? 'ACCIONES QUE CAUSAN DAÑO (errores críticos):\n- ' + crit.join('\n- ') + '\n\n' : '') +

      '2. Sé realista y concreto: describe solo lo que el socorrista podría percibir (lo que ve, oye, toca, lo que dicen los testigos, lo que responde la víctima). No des datos que no haya explorado: si pregunta si respira, describe lo que observa al mirar, oír y sentir.\n' +

  function errCopy(e) {
